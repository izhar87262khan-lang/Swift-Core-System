<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NK Mobile Shop - Premium POS & Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0071e3;
            --success: #34c759;
            --danger: #ff3b30;
            --warning: #ff9500;
            --bg: #f5f5f7;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text: #1d1d1f;
            --border: #d2d2d7;
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transition: var(--transition);
            animation: fadeIn 0.5s ease-in-out;
        }

        .card:hover {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #515154;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            background: #fff;
            color: var(--text);
            transition: var(--transition);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success);
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            font-size: 14px;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #fafafa;
            font-weight: 600;
            color: #515154;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-cash { background: #e8f8ed; color: var(--success); }
        .badge-credit { background: #fff4e5; color: var(--warning); }

        .summary-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 12px;
            color: #86868b;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <header>
        <h1>NK MOBILE SHOP - POS System</h1>
        <span id="live-time" style="font-size: 14px; font-weight: 500; color: #86868b;"></span>
    </header>

    <div class="container">
        <!-- Left Side: Add Stock & Purchase Details -->
        <div class="card">
            <h2>📦 نئی انوینٹری / اسٹاک درج کریں</h2>
            <form id="stock-form">
                <div class="form-group">
                    <label>ماڈل / آئٹم کا نام</label>
                    <input type="text" id="item-name" placeholder="مثلاً: iPhone 13 Pro Max / Samsung S22" required>
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <label>کل قیمت (Total Price)</label>
                        <input type="number" id="item-price" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label>خرید کی قسم (Payment Type)</label>
                        <select id="pay-type">
                            <option value="Cash">نقد (Cash)</option>
                            <option value="Credit">ادھار (Credit)</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>کتنی رقم ادا کی (Paid Amount)</label>
                        <input type="number" id="paid-amount" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label>باقی رقم (Remaining Balance)</label>
                        <input type="number" id="remaining-amount" placeholder="آటో حساب" readonly style="background: #f9f9fb;">
                    </div>
                </div>

                <button type="submit" class="btn">اسٹاک محفوظ کریں</button>
            </form>
        </div>

        <!-- Right Side: Live Stock & Ledger -->
        <div class="card">
            <h2>📊 موجودہ اسٹاک اور ادھار کا ریکارڈ</h2>
            
            <div class="summary-box">
                <div class="stat-card">
                    <h3>کل مالیت</h3>
                    <p id="total-val">0</p>
                </div>
                <div class="stat-card">
                    <h3>کل ادائیگی</h3>
                    <p id="total-paid" style="color: var(--success);">0</p>
                </div>
                <div class="stat-card">
                    <h3>کل بقایا ادھار</h3>
                    <p id="total-rem" style="color: var(--danger);">0</p>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>آئٹم</th>
                            <th>قیمت</th>
                            <th>قسم</th>
                            <th>ادا شدہ</th>
                            <th>بقایا</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body">
                        <tr>
                            <td colspan="5" style="text-align: center; color: #86868b;">کوئی ریکارڈ موجود نہیں</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Live Time Update
        setInterval(() => {
            const now = new Date();
            document.getElementById('live-time').innerText = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
        }, 1000);

        // Auto Calculate Remaining Amount
        const priceInput = document.getElementById('item-price');
        const paidInput = document.getElementById('paid-amount');
        const remInput = document.getElementById('remaining-amount');

        function calcRemaining() {
            const price = parseFloat(priceInput.value) || 0;
            const paid = parseFloat(paidInput.value) || 0;
            const rem = price - paid;
            remInput.value = rem >= 0 ? rem : 0;
        }

        priceInput.addEventListener('input', calcRemaining);
        paidInput.addEventListener('input', calcRemaining);

        // Form Submit & LocalStorage
        const stockForm = document.getElementById('stock-form');
        const stockTableBody = document.getElementById('stock-table-body');
        
        let stockList = JSON.parse(localStorage.getItem('nk_stock')) || [];

        function renderStock() {
            stockTableBody.innerHTML = '';
            if (stockList.length === 0) {
                stockTableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #86868b;">کوئی ریکارڈ موجود نہیں</td></tr>`;
                document.getElementById('total-val').innerText = '0';
                document.getElementById('total-paid').innerText = '0';
                document.getElementById('total-rem').innerText = '0';
                return;
            }

            let tVal = 0, tPaid = 0, tRem = 0;

            stockList.forEach(item => {
                tVal += item.price;
                tPaid += item.paid;
                tRem += item.rem;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${item.name}</strong></td>
                    <td>Rs. ${item.price.toLocaleString()}</td>
                    <td><span class="badge ${item.type === 'Cash' ? 'badge-cash' : 'badge-credit'}">${item.type}</span></td>
                    <td>Rs. ${item.paid.toLocaleString()}</td>
                    <td style="color: ${item.rem > 0 ? 'var(--danger)' : 'inherit'};">Rs. ${item.rem.toLocaleString()}</td>
                `;
                stockTableBody.appendChild(row);
            });

            document.getElementById('total-val').innerText = 'Rs. ' + tVal.toLocaleString();
            document.getElementById('total-paid').innerText = 'Rs. ' + tPaid.toLocaleString();
            document.getElementById('total-rem').innerText = 'Rs. ' + tRem.toLocaleString();
        }

        stockForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newItem = {
                name: document.getElementById('item-name').value,
                price: parseFloat(priceInput.value),
                type: document.getElementById('pay-type').value,
                paid: parseFloat(paidInput.value),
                rem: parseFloat(remInput.value)
            };

            stockList.push(newItem);
            localStorage.setItem('nk_stock', JSON.stringify(stockList));
            renderStock();
            stockForm.reset();
        });

        renderStock();
    </script>
</body>
</html>
